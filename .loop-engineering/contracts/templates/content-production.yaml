# Content Improvement Loop: Baseline → Audience → Variants → Evaluation → Selection → Learning
target_score: 75
quality_threshold: 65
max_iterations: 5
risk_level: low
verification_methods:
  - editorial_review
  - baseline_comparison
acceptance_criteria:
  - Baseline performans belgelendi
  - En az 2 varyant üretildi ve değerlendirildi
  - Seçilen varyant gerekçeli
stop_conditions:
  - target_score_reached
  - max_iterations_reached
  - user_cancelled
allowed_tools:
  - fs
forbidden_actions:
  - customer_send
